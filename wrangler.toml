name = "trumpgpt-v2-preview"
main = "worker/index.mjs"
compatibility_date = "2026-06-01"
preview_urls = false

[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
AI_PROVIDER = "mock"
ENABLE_LIVE = "false"
LIVE_CALL_LIMIT = "0"
LIVE_BUDGET_CENTS = "0"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

[observability]
enabled = false
